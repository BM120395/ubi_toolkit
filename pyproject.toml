[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubi-toolkit"
version = "1.10.0"
description = "Deterministic UBI firmware analysis, extraction, and surgical repacking toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "Bharatiy" }]
keywords = ["ubi", "ubifs", "firmware", "nand", "flash", "reverse-engineering", "embedded"]

[project.optional-dependencies]
# Optional progress bar — the CLI works without it (graceful fallback).
tqdm = ["tqdm"]

[project.scripts]
ubipack = "ubi_toolkit.ubipack:main"

[tool.setuptools.packages.find]
include = ["ubi_toolkit*"]
